[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --alluredir=allure-results
    --clean-alluredir
    --html=reports/pytest_report.html
    --self-contained-html
    -p no:warnings
    --log-cli-level=INFO
    --log-cli-format=%(asctime)s [%(levelname)8s] %(name)s: %(message)s
    --log-cli-date-format=%Y-%m-%d %H:%M:%S
    --log-file=logs/pytest.log
    --log-file-level=DEBUG
    --log-file-format=%(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d: %(funcName)s(): %(message)s
    --log-file-date-format=%Y-%m-%d %H:%M:%S
markers =
    smoke: marks tests as smoke tests (deselect with '-m "not smoke"')
    regression: marks tests as regression tests
    android: marks tests for Android platform
    ios: marks tests for iOS platform
    slow: marks tests as slow (deselect with '-m "not slow"')
    critical: marks tests as critical functionality
    api: marks tests for API testing
    ui: marks tests for UI testing
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning